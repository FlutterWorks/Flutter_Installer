name: flutter_installer
description: Flutter Installer is an installer for Flutter built with Flutter.
publish_to: "none"
version: 0.0.8+8

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  bloc: 8.1.4
  flutter_bloc: 8.1.5
  equatable: 2.0.5
  provider: 6.1.2

  auto_route: 8.1.3

  bitsdojo_window: 0.1.6

  file_selector: 1.0.3

  logging: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: 9.1.7
  mocktail: 1.0.3

  flutter_lints: 3.0.2

  build_runner: 2.4.7
  auto_route_generator: 8.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/app_logos/
    - assets/misc/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono/RobotoMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoMono/RobotoMono-Bold.ttf
          weight: 700
